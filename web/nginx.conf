# Cache-Control of the static files (T-041), chosen by path. A map (not `add_header` inside locations) because an
# add_header in a location would drop the server-level Referrer-Policy below. An empty value adds no header, so the
# proxied API keeps the Cache-Control the API sets itself. $uri is the final uri after try_files, so the SPA fallback
# (any route served as /index.html) is no-cache too.
#   - the shell, the service worker and the manifest must always be revalidated: a stale sw.js or index.html would pin
#     users to an old version (the browser also bypasses the HTTP cache for sw.js by default, this makes it explicit);
#   - /assets/* are content-hashed by the build, so they never change under the same name: cache for a year.
# sw.js lives at the root, so its default scope is "/" and no Service-Worker-Allowed header is needed.
map $uri $static_cache_control {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(index\.html|sw\.js|offline\.html|manifest\.webmanifest)$ "no-cache";
    ~^/icons/ "public, max-age=86400";
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header Cache-Control $static_cache_control always;

    # Compress the SPA's text assets (T-024 Lighthouse: the JS was sent uncompressed, ~380 KB instead of ~145 KB).
    # API responses are not touched: gzip applies to what nginx serves and to proxied JSON alike, which is fine
    # for JSON; images are already compressed and not in gzip_types.
    # The set-password link carries a one-time token (T-072); never send it on as a Referer. No location below sets
    # its own add_header, so this applies to every response, including the proxied API.
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # SignalR hubs (T-034): WebSocket upgrade, no buffering, and a read timeout longer than the hub's keep-alive
    # (15 s pings) so an idle but healthy socket is not cut. Same Host/Forwarded headers as the rest of /api/.
    location /api/hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The image's mime.types does not know .webmanifest (it would be application/octet-stream). A `types` block in the
    # server would replace the whole inherited map, so set the type for this one file with default_type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri /index.html;
    }
}
