server {
    listen 8080;
    root /usr/share/nginx/html;

    # Compress the SPA's text assets (T-024 Lighthouse: the JS was sent uncompressed, ~380 KB instead of ~145 KB).
    # API responses are not touched: gzip applies to what nginx serves and to proxied JSON alike, which is fine
    # for JSON; images are already compressed and not in gzip_types.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # SignalR hubs (T-034): WebSocket upgrade, no buffering, and a read timeout longer than the hub's keep-alive
    # (15 s pings) so an idle but healthy socket is not cut. Same Host/Forwarded headers as the rest of /api/.
    location /api/hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
